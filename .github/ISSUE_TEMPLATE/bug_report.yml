name: Bug report
description: Report a reproducible software or scientific correctness defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach raw laboratory data, identifying metadata, credentials, or private paths.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Ubuntu Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and redacted configuration
      description: Include the exact command and a minimal sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the traceback and output metadata without sensitive paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal synthetic reproducer
      description: Describe or link non-identifying synthetic inputs only.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: I removed raw data, identifiers, credentials, and private filesystem paths.
          required: true
