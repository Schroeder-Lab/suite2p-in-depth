[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suite2p-in-depth"
version = "0.1.0"
description = "Depth-motion correction and preprocessing for two-photon imaging"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Schroeder Lab"}]
license = "GPL-3.0-only"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "matplotlib>=3.8,<3.12",
    "natsort>=8.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "suite2p[gui,nwb] @ git+https://github.com/MouseLand/suite2p.git@90be8953c03c6f4275dcd392ac1c6f554116169e",
    "tifffile>=2024.2.12",
    "torch>=2.2",
]

[project.urls]
Documentation = "https://github.com/Schroeder-Lab/suite2p-in-depth#readme"
Issues = "https://github.com/Schroeder-Lab/suite2p-in-depth/issues"
Repository = "https://github.com/Schroeder-Lab/suite2p-in-depth"

[project.scripts]
suite2p-in-depth = "suite2p_in_depth.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pandas-stubs>=2.2,<4",
    "pip-audit>=2.7",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.6",
    "setuptools>=83.0.0",
    "twine>=5.1",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suite2p_in_depth = ["config/*.yaml", "config/*.csv"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=suite2p_in_depth --cov-report=term-missing"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["suite2p_in_depth"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scratch_files"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "B",
    "UP",
    "PT",
    "D",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D200",
    "D205",
    "D400",
    "D401",
    "D404",
    "D414",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
files = [
    "run_suite2p_in_depth.py",
    "src/suite2p_in_depth/cli.py",
    "src/suite2p_in_depth/validation.py",
    "src/suite2p_in_depth/run_manifest.py",
    "src/suite2p_in_depth/general.py",
    "src/suite2p_in_depth/suite2p_compat.py",
    "src/suite2p_in_depth/suite2p_extensions.py",
    "src/suite2p_in_depth/registration_numerics.py",
    "src/suite2p_in_depth/registration_plotting.py",
]
strict = true
follow_imports = "skip"
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "suite2p_in_depth.correct_traces",
    "suite2p_in_depth.run_suite2p",
    "suite2p_in_depth.zregister",
]
follow_untyped_imports = false
ignore_errors = true
